<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('Microsoft To-Do')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />

  <meta name="x-icue-restrictions" data-restrictions='[{ "device": "dashboard_lcd" }]' />
  <meta name="x-icue-widget-group" content="tr('Productivity')" />

  <script type="text/javascript" src="common/tools/media_viewer/MediaViewer.js"></script>
  <link rel="stylesheet" type="text/css" href="common/tools/media_viewer/MediaViewer.css" />

  <!-- Feature properties -->
  <meta name="x-icue-property" content="proxyUrl" data-label="tr('Proxy URL (xeneon-graph-proxy)')" data-type="textfield" data-default="'http://localhost:8585'" />
  <meta name="x-icue-property" content="listId" data-label="tr('List ID (blank = default list)')" data-type="textfield" data-default="''" />
  <meta name="x-icue-property" content="widgetTitle" data-label="tr('Title')" data-type="textfield" data-default="'My Day'" />
  <meta name="x-icue-property" content="maxItems" data-label="tr('Max Tasks')" data-type="slider" data-default="12" data-min="3" data-max="30" data-step="1" />
  <meta name="x-icue-property" content="refreshMinutes" data-label="tr('Refresh Interval')" data-type="slider" data-default="5" data-min="1" data-max="30" data-step="1" data-unit-label="'min'" />

  <!-- Widget Personalization -->
  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#ffffff'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#e8617c'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#15161c'" />
  <meta name="x-icue-property" content="backgroundMedia" data-label="tr('Background Image')" data-type="media-selector" data-filters="['*.png','*.jpg','*.jpeg','*.webp']" />
  <meta name="x-icue-property" content="glassBlur" data-label="tr('Glass Blur')" data-type="slider" data-default="0" data-min="0" data-max="30" data-step="1" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('Microsoft To-Do')", "properties": ["proxyUrl", "listId", "widgetTitle", "maxItems", "refreshMinutes"] },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "backgroundMedia", "glassBlur", "transparency"] }
  ]
  </script>

  <link rel="stylesheet" type="text/css" href="styles/MsTodo.css" />
</head>
<body>
  <div class="widget-root">
    <div class="widget-background" aria-hidden="true">
      <div class="main-glass"></div>
      <div id="media-background"></div>
    </div>

    <div class="main-content">
      <div class="loading-state state-panel">
        <div class="spinner"></div>
        <div class="state-text">Loading tasks…</div>
      </div>

      <div class="error-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22L12 2zm0 6c.6 0 1 .4 1 1v5a1 1 0 0 1-2 0V9c0-.6.4-1 1-1zm0 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
        <div class="state-text error-text">Unable to load tasks</div>
        <div class="state-sub error-detail"></div>
      </div>

      <div class="auth-state state-panel" style="display:none;">
        <svg class="state-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>
        <div class="state-text">Microsoft sign-in needed</div>
        <div class="state-sub">Go to <span class="auth-uri accent">microsoft.com/devicelogin</span><br>and enter code</div>
        <div class="auth-code">·····</div>
      </div>

      <div class="empty-state state-panel" style="display:none;">
        <svg class="state-icon ok" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.4-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7z"/></svg>
        <div class="state-text">All done</div>
        <div class="state-sub">No open tasks</div>
      </div>

      <div class="content" style="display:none;">
        <header class="topbar">
          <div class="topbar-left">
            <div class="title-row">
              <span class="widget-title">My Day</span>
              <svg class="chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="subtitle">Microsoft To-Do</div>
          </div>
          <div class="topbar-right">
            <div class="task-count hero-value">0</div>
            <div class="task-count-label">open</div>
          </div>
        </header>
        <div class="task-list" id="taskList"></div>
        <div class="overflow-hint" id="overflowHint" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    icueEvents = {
      'onDataUpdated': onIcueDataUpdated,
      'onICUEInitialized': onIcueInitialized,
      'onUpdateRequested': onUpdateRequested
    };

    let languageCode = 'en';

    function getIcueProperty(name) {
      if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
        const value = window[name];
        if (value !== undefined && value !== null && value !== '') return value;
      }
      try {
        const value = Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
        if (value !== undefined && value !== null && value !== '') return value;
      } catch (e) {}
      return undefined;
    }

    function clampRange(v, min, max, d) {
      v = Number(v);
      if (!Number.isFinite(v)) return d;
      return Math.max(min, Math.min(max, v));
    }

    /* ---------- Media background ---------- */
    const mediaMount = document.getElementById('media-background');
    function createMediaBackgroundComponent(container) {
      if (!container) return { clear: function () {}, loadMedia: function () {} };
      if (typeof MediaViewer === 'function') {
        const viewer = new MediaViewer({
          container: container,
          onMediaLoaded: function () { container.classList.add('has-media'); },
          onMediaError: function (err) { container.classList.remove('has-media'); console.error(err); }
        });
        return {
          clear: function () { viewer.clear(); container.classList.remove('has-media'); },
          loadMedia: function (c) { viewer.loadMedia(c); }
        };
      }
      return {
        clear: function () { container.style.backgroundImage = ''; container.classList.remove('has-media'); },
        loadMedia: function (c) {
          const p = c && (c.path || c.pathToAsset);
          if (!p) { this.clear(); return; }
          container.style.backgroundImage = "url('" + p + "')";
          container.style.backgroundSize = 'cover';
          container.style.backgroundPosition = 'center';
          container.classList.add('has-media');
        }
      };
    }
    const mediaBackgroundComponent = createMediaBackgroundComponent(mediaMount);

    function applyStyles() {
      const root = document.documentElement;
      root.style.setProperty('--bg-opacity', clampRange(getIcueProperty('transparency'), 0, 100, 100) / 100);
      const tc = getIcueProperty('textColor');
      const ac = getIcueProperty('accentColor');
      const bgc = getIcueProperty('backgroundColor');
      root.style.setProperty('--text-color', (typeof tc === 'string' && tc) ? tc : '#ffffff');
      root.style.setProperty('--accent-color', (typeof ac === 'string' && ac) ? ac : '#e8617c');
      root.style.setProperty('--bg-color', (typeof bgc === 'string' && bgc) ? bgc : '#15161c');
      root.style.setProperty('--bg-blur', clampRange(getIcueProperty('glassBlur'), 0, 30, 0) + 'px');
      const bgMedia = getIcueProperty('backgroundMedia');
      if (!bgMedia) { mediaBackgroundComponent.clear(); return; }
      mediaBackgroundComponent.loadMedia({
        path: bgMedia.pathToAsset,
        baseWidth: bgMedia.baseWidth,
        baseHeight: bgMedia.baseHeight,
        scale: bgMedia.scale, positionX: bgMedia.positionX,
        positionY: bgMedia.positionY, angle: bgMedia.angle
      });
    }

    function showState(state) {
      ['loading-state', 'error-state', 'auth-state', 'empty-state', 'content'].forEach(s => {
        const el = document.querySelector('.' + s);
        if (el) el.style.display = s === state ? '' : 'none';
      });
    }

    /* ---------- Proxy API ---------- */
    let lastGoodTasks = null;
    let refreshTimer = null;
    let authPollTimer = null;
    let fetchInFlight = false;

    function proxyBase() {
      const u = (getIcueProperty('proxyUrl') || 'http://localhost:8585').toString().trim();
      return u.replace(/\/+$/, '');
    }

    function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

    function dueInfo(dueStr) {
      if (!dueStr) return null;
      const due = new Date(dueStr);
      if (isNaN(due)) return null;
      const diffDays = Math.round((startOfDay(due) - startOfDay(new Date())) / 86400000);
      if (diffDays < 0) return { cls: 'overdue', label: 'Overdue', sort: -1 + diffDays / 10000 };
      if (diffDays === 0) return { cls: 'today', label: 'Today', sort: 0 };
      if (diffDays === 1) return { cls: 'soon', label: 'Tomorrow', sort: 1 };
      return {
        cls: diffDays <= 7 ? 'soon' : 'later',
        label: due.toLocaleDateString(languageCode, { month: 'short', day: 'numeric' }),
        sort: diffDays
      };
    }

    async function enterAuthState() {
      showState('auth-state');
      const codeEl = document.querySelector('.auth-code');
      try {
        const res = await fetch(proxyBase() + '/auth/start', { method: 'POST' });
        const data = await res.json();
        if (data.already_authenticated) { loadTasks(); return; }
        codeEl.textContent = data.user_code || '—';
        const uriEl = document.querySelector('.auth-uri');
        if (data.verification_uri) uriEl.textContent = data.verification_uri.replace(/^https?:\/\//, '');
      } catch (e) {
        codeEl.textContent = '—';
      }
      if (authPollTimer) clearInterval(authPollTimer);
      authPollTimer = setInterval(async () => {
        try {
          const s = await (await fetch(proxyBase() + '/auth/status')).json();
          if (s.authenticated) {
            clearInterval(authPollTimer);
            authPollTimer = null;
            loadTasks();
          }
        } catch (e) {}
      }, 8000);
    }

    async function loadTasks() {
      if (fetchInFlight) return;
      fetchInFlight = true;
      try {
        const listId = (getIcueProperty('listId') || '').toString().trim();
        const url = proxyBase() + '/api/todo/tasks?top=100' + (listId ? '&list=' + encodeURIComponent(listId) : '');
        const res = await fetch(url);
        if (res.status === 401) { enterAuthState(); return; }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const tasks = await res.json();
        lastGoodTasks = tasks;
        renderTasks(tasks, false);
      } catch (e) {
        console.error('To-Do fetch failed:', e);
        if (lastGoodTasks) renderTasks(lastGoodTasks, true);
        else {
          showState('error-state');
          document.querySelector('.error-detail').textContent =
            'Cannot reach proxy at ' + proxyBase();
        }
      } finally {
        fetchInFlight = false;
      }
    }

    function renderTasks(tasks, offline) {
      const max = clampRange(getIcueProperty('maxItems'), 3, 30, 12);

      let shaped = tasks.map(t => ({
        title: t.title,
        listName: t.listName || '',
        due: dueInfo(t.due),
        important: t.importance === 'high'
      }));

      shaped.sort((a, b) => {
        const as = a.due ? a.due.sort : 9999;
        const bs = b.due ? b.due.sort : 9999;
        if (as !== bs) return as - bs;
        return (b.important ? 1 : 0) - (a.important ? 1 : 0);
      });

      const total = shaped.length;
      const visible = shaped.slice(0, max);

      document.querySelector('.widget-title').textContent = getIcueProperty('widgetTitle') || 'My Day';
      document.querySelector('.subtitle').textContent = 'Microsoft To-Do' + (offline ? ' • offline' : '');
      document.querySelector('.task-count').textContent = total;
      document.querySelector('.task-count-label').textContent = total === 1 ? 'task' : 'tasks';

      if (total === 0) { showState('empty-state'); return; }

      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';
      visible.forEach(t => {
        const row = document.createElement('div');
        row.className = 'task-row';

        const circle = document.createElement('span');
        circle.className = 'check-circle';

        const main = document.createElement('div');
        main.className = 'task-main';
        const name = document.createElement('div');
        name.className = 'task-name';
        name.textContent = t.title;
        const meta = document.createElement('div');
        meta.className = 'task-meta';
        if (t.listName) {
          const ln = document.createElement('span');
          ln.className = 'task-list-name';
          ln.textContent = t.listName;
          meta.appendChild(ln);
        }
        if (t.due) {
          const chip = document.createElement('span');
          chip.className = 'due-chip due-' + t.due.cls;
          chip.textContent = t.due.label;
          meta.appendChild(chip);
        }
        main.appendChild(name);
        main.appendChild(meta);

        const star = document.createElement('span');
        star.className = 'prio-star' + (t.important ? ' prio-on' : '');
        star.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 20.6l1.5-6.5-5-4.4 6.6-.6L12 3l2.7 6.1 6.6.6-5 4.4 1.5 6.5z"/></svg>';

        row.appendChild(circle);
        row.appendChild(main);
        row.appendChild(star);
        listEl.appendChild(row);
      });

      const hint = document.getElementById('overflowHint');
      if (total > visible.length) {
        hint.textContent = '+' + (total - visible.length) + ' more';
        hint.style.display = '';
      } else {
        hint.style.display = 'none';
      }

      showState('content');
    }

    /* ---------- Lifecycle ---------- */
    function scheduleRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      const mins = clampRange(getIcueProperty('refreshMinutes'), 1, 30, 5);
      refreshTimer = setInterval(loadTasks, mins * 60000);
    }

    function onUpdateRequested() { loadTasks(); }

    function onIcueDataUpdated() {
      applyStyles();
      scheduleRefresh();
      loadTasks();
    }

    function onIcueInitialized() {
      if (typeof iCUE !== 'undefined' && iCUE.iCUELanguage) languageCode = iCUE.iCUELanguage;
      onIcueDataUpdated();
    }

    if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
      onIcueInitialized();
    } else {
      onIcueDataUpdated();
    }
  </script>
</body>
</html>
